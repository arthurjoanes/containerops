name: ContainerOps
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containerops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-backups:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Identidade de arquivos no Windows
        run: python -m unittest discover -s tests -p test_file_identity.py -v
      - name: Catálogo no Windows
        run: python -m unittest discover -s tests -p test_backup_catalog.py -v
      - name: Transporte no Windows
        run: python -m unittest discover -s tests -p test_backup_package.py -v
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONTAINEROPS_RUNTIME: ${{ github.workspace }}/.runtime-containerops
      CONTAINEROPS_SESSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup e build
        run: |
          python3 scripts/ops.py setup
          python3 scripts/ops.py build
          python3 scripts/ops.py sbom --version 1.0.0
          python3 scripts/ops.py build --version 2.0.0
          python3 scripts/ops.py sbom --version 2.0.0
      - name: Testes
        run: python3 scripts/ops.py verify
      - name: Backup, restore, release e rollback
        run: |
          python3 scripts/ops.py prove --scenario operations
          python3 scripts/transfer_proof.py --destination-session ci-rx-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Liberar cache de build da sessão antes dos scans
        run: |
          df -h .
          # Os builds terminaram; as imagens carregadas e as evidências são preservadas.
          docker buildx prune --builder "pf-containerops-builder-${CONTAINEROPS_SESSION}" --all --force
          df -h .
      - name: Scan e relatório
        run: |
          python3 scripts/ops.py scan --version 1.0.0
          python3 scripts/ops.py scan --version 2.0.0
          python3 scripts/scan_services.py --offline
          python3 scripts/ops.py report
      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: containerops-evidence
          # O runtime é oculto; publicar só os caminhos abaixo.
          include-hidden-files: true
          path: |
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/docs/evidence/
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/docs/report.html
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/docs/documentation/
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/artifacts/*/scanner/*.json
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/artifacts/*/sbom-*.json
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/artifacts/*/provenance-*.json
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/artifacts/*/build-metadata.json
            .runtime-containerops/sessions/${{ env.CONTAINEROPS_SESSION }}/service-scans/*/scanner/*.json
            .runtime-containerops/sessions/ci-rx-${{ github.run_id }}-${{ github.run_attempt }}/docs/evidence/
          if-no-files-found: warn
