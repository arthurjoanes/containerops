title = "ContainerOps secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 fingerprints of source files in build and runtime evidence"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/(problem-proof/[^/]+/(sources-[12]\.0\.0|manifest)|problem-proof-latest|review-followup-source-images)\.json$''']
regexes = ['''(?:api|test_api)\.py"\s*:\s*"[a-f0-9]{64}"''']

[[rules.allowlists]]
description = "Verified SHA-256 of API source in admission regression evidence"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/security-admission-20260922/manifest\.json$''']
regexes = ['''api\.py"\s*:\s*"58af19b254df59d38e1cf3593d23e5f0a55ab0632db96e55259fa580ecbe80ad"''']

[[rules.allowlists]]
description = "Verified API and test source SHA-256 values in the bounded admission and operations manifests"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/(operations-proof-latest|admission-measurement/20260922T031250-0300-b87b5952/manifest|editorial-20260922/execution)\.json$''']
regexes = [
  '''api\.py"\s*:\s*"58af19b254df59d38e1cf3593d23e5f0a55ab0632db96e55259fa580ecbe80ad"''',
  '''test_api\.py"\s*:\s*"3e04692f0c60820f08bc1b7ff9aa6d239e09d63efb4121a6eaa6539ff4dcbe33"''',
]
