name: pf-containerops

x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "3"

x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: containerops
  DB_USER: containerops_app
  DB_PASSWORD_FILE: /run/secrets/db_password
  # Duração controlada de job é recurso de demo. Perfil endurecido: DEMO_MODE=false.
  DEMO_MODE: "${DEMO_MODE:-true}"

x-app: &app
  image: ${APP_IMAGE:-containerops-app:1.0.0}
  platform: linux/amd64
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=1700
  environment: *app-environment
  pids_limit: 64
  mem_limit: 192m
  cpus: 0.50
  logging: *logging
  stop_grace_period: 25s

x-db-tool: &db-tool
  image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
  platform: linux/amd64
  profiles: [tools]
  user: "999:999"
  entrypoint: ["/bin/sh", "/opt/containerops/tool.sh"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=8m,uid=999,gid=999,mode=1700
  volumes:
    # UID 999 pode escrever neste diretório sem inicialização como root.
    # Este volume é separado do pgdata.
    - artifacts:/var/lib/postgresql/data
    - ./docker/db/tool.sh:/opt/containerops/tool.sh:ro
  networks: [data]
  pids_limit: 32
  mem_limit: 128m
  cpus: 0.50
  logging: *logging

services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    platform: linux/amd64
    environment:
      POSTGRES_DB: containerops
      POSTGRES_USER: containerops_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # O entrypoint inicializa o volume como root e executa postgres com UID 999.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=999,gid=999,mode=3775
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-roles.sh:/docker-entrypoint-initdb.d/10-containerops-roles.sh:ro
    secrets: [db_admin, db_migrator, db_app, db_backup]
    networks: [data]
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=64MB", "-c", "password_encryption=scram-sha-256"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "containerops_admin", "-d", "containerops"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 64m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    logging: *logging

  api:
    <<: *app
    command: ["python", "-m", "containerops.api"]
    environment:
      <<: *app-environment
      API_TOKENS_FILE: /run/secrets/api_tokens
    secrets:
      - source: db_app
        target: db_password
      - api_tokens
    networks: [front, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "containerops.worker"]
    secrets:
      - source: db_app
        target: db_password
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "containerops.worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped

  proxy:
    image: ${PROXY_IMAGE:-containerops-proxy:local}
    platform: linux/amd64
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=1700
    networks: [front]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8105}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/proxy-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.25
    logging: *logging

  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-environment
      DB_USER: containerops_migrator
    command: ["python", "-m", "containerops.manage", "migrate", "--target", "1"]
    secrets:
      - source: db_migrator
        target: db_password
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  manage:
    <<: *app
    profiles: [tools]
    command: ["python", "-m", "containerops.manage", "snapshot"]
    secrets:
      - source: db_app
        target: db_password
    networks: [data]

  test:
    <<: *app
    profiles: [tools]
    image: ${TEST_IMAGE:-containerops-test:local}
    environment:
      <<: *app-environment
      API_TOKENS_FILE: /run/secrets/api_tokens
      MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator
      CONTAINEROPS_TEST_DATABASE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider
    command: ["python", "-m", "pytest", "/app/tests"]
    secrets:
      - source: db_app
        target: db_password
      - source: db_migrator
        target: db_migrator
      - api_tokens
    networks: [data]
    mem_limit: 256m

  backup:
    <<: *db-tool
    command: ["dump"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: containerops
      PGUSER: containerops_backup
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_backup
        target: db_password

  restore:
    <<: *db-tool
    command: ["restore"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: containerops
      PGUSER: containerops_migrator
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_migrator
        target: db_password

networks:
  front:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
  artifacts:

secrets:
  db_admin:
    file: ${CONTAINEROPS_RUNTIME:?Configure o runtime reservado ao ContainerOps}/secrets/db_admin
  db_migrator:
    file: ${CONTAINEROPS_RUNTIME:?Configure o runtime reservado ao ContainerOps}/secrets/db_migrator
  db_app:
    file: ${CONTAINEROPS_RUNTIME:?Configure o runtime reservado ao ContainerOps}/secrets/db_app
  db_backup:
    file: ${CONTAINEROPS_RUNTIME:?Configure o runtime reservado ao ContainerOps}/secrets/db_backup
  api_tokens:
    file: ${CONTAINEROPS_RUNTIME:?Configure o runtime reservado ao ContainerOps}/secrets/api_tokens
