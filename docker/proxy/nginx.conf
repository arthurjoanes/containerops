worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    map $upstream_http_x_request_id $correlation_request_id {
        default $upstream_http_x_request_id;
        "" $request_id;
    }
    log_format containerops escape=json '{"service":"proxy","version":"$nginx_version",'
        '"request_id":"$correlation_request_id","proxy_request_id":"$request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';
    access_log /dev/stdout containerops;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Re-resolve when Compose recreates the API with a different address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
